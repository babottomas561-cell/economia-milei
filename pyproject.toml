[project]
name = "economia-milei"
version = "0.1.0"
description = "La economía de Milei en datos: salario real, inflación, actividad, inversión, cuentas fiscales, bonos y acciones, dic-2023 a oct-2026."
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "requests>=2.34.2",
    "tabulate>=0.10.0",
    "yfinance>=1.7.0",
]

[dependency-groups]
dev = ["pytest>=9.2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::pandas.errors.Pandas4Warning"]
